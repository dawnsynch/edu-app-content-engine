name: Deploy Development

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: edu-dawnsynch-development
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
      release_sha: ${{ steps.images.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: images
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${repository}/api:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${repository}/web:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_development_image=ghcr.io/${repository}/api:development" >> "$GITHUB_OUTPUT"
          echo "web_development_image=ghcr.io/${repository}/web:development" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.images.outputs.api_image }}
            ${{ steps.images.outputs.api_development_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.images.outputs.web_image }}
            ${{ steps.images.outputs.web_development_image }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_sha }}

      - name: Validate deployment settings
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          : "${VM_HOST:?VM_HOST is not configured}"
          : "${VM_USER:?VM_USER is not configured}"
          : "${VM_APP_DIR:?VM_APP_DIR is not configured}"
          : "${VM_SSH_KEY:?VM_SSH_KEY is not configured}"
          : "${VM_KNOWN_HOSTS:?VM_KNOWN_HOSTS is not configured}"
          : "${GHCR_USERNAME:?GHCR_USERNAME is not configured}"
          : "${GHCR_PAT:?GHCR_PAT is not configured}"
          [[ "${VM_SSH_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$VM_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
        run: |
          port="${VM_SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/deploy_key" -p "$port" "$VM_USER@$VM_HOST" \
            "mkdir -p '$VM_APP_DIR/scripts'"
          scp -i "$HOME/.ssh/deploy_key" -P "$port" \
            docker-compose.yml docker-compose.deploy.yml \
            "$VM_USER@$VM_HOST:$VM_APP_DIR/"
          scp -i "$HOME/.ssh/deploy_key" -P "$port" scripts/deploy.sh \
            "$VM_USER@$VM_HOST:$VM_APP_DIR/scripts/deploy.sh"

      - name: Authenticate server to GHCR
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          port="${VM_SSH_PORT:-22}"
          printf '%s' "$GHCR_PAT" | \
            ssh -i "$HOME/.ssh/deploy_key" -p "$port" "$VM_USER@$VM_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy and verify
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          port="${VM_SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/deploy_key" -p "$port" "$VM_USER@$VM_HOST" \
            "cd '$VM_APP_DIR' && chmod 700 scripts/deploy.sh && API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' RELEASE_SHA='$RELEASE_SHA' scripts/deploy.sh"
