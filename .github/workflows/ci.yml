name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edu_dawnsynch_test
          POSTGRES_USER: edu_test
          POSTGRES_PASSWORD: edu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu_test -d edu_dawnsynch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://edu_test:edu_test_password@localhost:5432/edu_dawnsynch_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://edu_test:edu_test_password@localhost:5432/edu_dawnsynch_test
      TEST_DATABASE_URL: postgresql+asyncpg://edu_test:edu_test_password@localhost:5432/edu_dawnsynch_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: alembic upgrade head
      - run: ruff check .
      - run: mypy app
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

